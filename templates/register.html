{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroSense NG - Register</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>🌿 AgroSense NG</h1>

        <h3>Create Account</h3>

        <div id="register-message" class="message"></div>

        <form id="register-form">

            <input
                type="text"
                id="full_name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <select id="state" required>

                <option value="">Select State</option>

                <option value="Abia">Abia</option>
                <option value="Adamawa">Adamawa</option>
                <option value="AkwaIbom">Akwa Ibom</option>
                <option value="Anambra">Anambra</option>
                <option value="Bauchi">Bauchi</option>
                <option value="Bayelsa">Bayelsa</option>
                <option value="Benue">Benue</option>
                <option value="Borno">Borno</option>
                <option value="CrossRiver">Cross River</option>
                <option value="Delta">Delta</option>
                <option value="Ebonyi">Ebonyi</option>
                <option value="Edo">Edo</option>
                <option value="Ekiti">Ekiti</option>
                <option value="Enugu">Enugu</option>
                <option value="FCT">FCT</option>
                <option value="Gombe">Gombe</option>
                <option value="Imo">Imo</option>
                <option value="Jigawa">Jigawa</option>
                <option value="Kaduna">Kaduna</option>
                <option value="Kano">Kano</option>
                <option value="Katsina">Katsina</option>
                <option value="Kebbi">Kebbi</option>
                <option value="Kogi">Kogi</option>
                <option value="Kwara">Kwara</option>
                <option value="Lagos">Lagos</option>
                <option value="Nasarawa">Nasarawa</option>
                <option value="Niger">Niger</option>
                <option value="Ogun">Ogun</option>
                <option value="Ondo">Ondo</option>
                <option value="Osun">Osun</option>
                <option value="Oyo">Oyo</option>
                <option value="Plateau">Plateau</option>
                <option value="Rivers">Rivers</option>
                <option value="Sokoto">Sokoto</option>
                <option value="Taraba">Taraba</option>
                <option value="Yobe">Yobe</option>
                <option value="Zamfara">Zamfara</option>

            </select>

            <select id="farm_size" required>

                <option value="">Select Farm Size</option>

                <option value="0.5">Less than 1 hectare</option>
                <option value="3">1 - 5 hectares</option>
                <option value="7.5">5 - 10 hectares</option>
                <option value="30">10 - 50 hectares</option>
                <option value="60">More than 50 hectares</option>

            </select>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <p>
            Already have an account?
            <a href="/accounts/login-page/">Login</a>
        </p>

    </div>

</div>

<script src="{% static 'js/auth.js' %}"></script>

</body>
</html>
